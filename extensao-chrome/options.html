<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Configurações — Mercadão O.S.</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; color: #1D1E1F; }
    h1 { font-size: 18px; }
    label { display: block; font-size: 12.5px; font-weight: 600; color: #5B5E62; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #E3E2DF; font-size: 13px; box-sizing: border-box; }
    button { margin-top: 12px; background: #F7931E; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
    p.ajuda { font-size: 11.5px; color: #8B8E92; margin-top: 6px; }
    p.status { font-size: 12.5px; color: #15803D; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Configurações — Mercadão O.S.</h1>
  <label for="baseUrl">Endereço do sistema</label>
  <input id="baseUrl" type="url" placeholder="http://localhost:3000">
  <p class="ajuda">
    Enquanto o sistema estiver rodando só no seu computador, deixe como
    http://localhost:3000. Quando for publicado (produção), troque para o
    endereço real e reinicie o navegador.
  </p>
  <button id="salvar">Salvar</button>
  <p id="status" class="status" hidden>Salvo.</p>
  <script src="options.js"></script>
</body>
</html>
